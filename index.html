<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo 6 - Respuesta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #cce7ff 0%, #a8d8ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #0077b6, #0096c7, #00b4d8);
        }

        .container:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .image-container {
            width: 100%;
            height: auto;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #e6f7ff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.05);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #0077b6;
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #0096c7;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        p {
            color: #023e8a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #0096c7 0%, #0077b6 100%);
            color: white;
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 118, 182, 0.3);
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0077b6 0%, #005885 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 118, 182, 0.4);
        }

        .signature {
            margin-top: 25px;
            color: #0077b6;
            font-style: italic;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeInUp 0.8s ease-out;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .image-container {
                width: auto;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="grupo6.jfif" alt="Grupo 6">
        </div>
        <h1>Grupo 6</h1>
        <p class="subtitle">Mi respuesta a sus cartas</p>
        <p>Queridos chicos, quiero agradecerles profundamente por todas las cartas que me han escrito. Cada una de ellas ha tocado mi corazón :v</p>
        <a href="respuesta.html" class="btn">Abrir Respuesta</a>
        <p class="signature">Atentamente, Carlos</p>
    </div>
</body>
</html>
